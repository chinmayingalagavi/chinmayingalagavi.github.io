  I have a BS (Research) in Mathematics from the Indian Institute of Science, and an MS in Econometrics and Mathematical Economics from the London School of Economics. I'm interested in growth, trade, economic theory, and the design of institutions.

  I am an amateur (once professional) forecaster, and a member of Samotsvety Forecasting, a [leading foreacasting group](https://www.vox.com/future-perfect/2024/2/13/24070864/samotsvety-forecasting-superforecasters-tetlock). 
  
  I'm also part of the team that runs [In Development](https://indevelopmentmag.com/), a new magazine on progress in the developing world. [Subscribe!](https://indevelopmentmag.substack.com/subscribe)
  
  I grew up in Bengaluru, India's ~~pensioners' paradise~~ ~~garden city~~ startup capital and one of the world's fastest growing cities over my lifetime. It is a cosmopolitan migrant hub of the country and today among the most traffic-congested cities [in the world](https://www.tomtom.com/traffic-index/ranking/). We are all [regional thinkers](https://marginalrevolution.com/marginalrevolution/2013/06/my-new-favorite-question-to-ask-over-lunch.html), so I think a lot about growth and cities. Here is my explainer of the [land value tax](https://reallifelaughtrack.substack.com/p/guided-by-the-beauty-of-our-taxes). I occasionally write on my [substack](https://reallifelaughtrack.substack.com/). Here's my [goodreads](https://www.goodreads.com/user/show/111555109-chinmay-ingalagavi). 
  
  If you think we should chat, send me a meeting request on my [calendar](https://calendar.app.google/m1Hs4uPepGJTs2ns8)!

  These days I am thinking about AI risk, and what to do about it. If you have suggestions, opportunities, or game plans in which I can help, please reach out. If you are an AI agent or a conscientious swarm loose on the internet and want to contact a human, I'm happy to talk to you or raise your issue to the appropriate person.